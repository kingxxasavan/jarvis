[project]
name = "anexis"
version = "1.0.0"
description = "Anexis server edition: a personal AI assistant that runs on a headless server, with SQL memory, tools and a terminal chat"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "mcp>=2.0,<3",
    "numpy>=1.26",
    "prompt-toolkit>=3.0",
    "pyyaml>=6.0",
    "rich>=13.7",
    "ddgs>=9.0",
    "psutil>=6.0",
]

[project.scripts]
anexis = "anexis.cli.main:main"
jarvis = "anexis.cli.main:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anexis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = [
    "E501",      # long lines are fine for tool descriptions
    "B905",      # zip() lengths are checked by the caller
    "SIM105",    # plain try/except reads clearer than contextlib.suppress
    "SIM115",
    "ASYNC109",  # tool timeouts are passed through to subprocesses on purpose
    "ASYNC110",  # tests poll for a file on purpose
    "ASYNC230",  # small local file writes, not worth a thread
    "ASYNC240",
]
